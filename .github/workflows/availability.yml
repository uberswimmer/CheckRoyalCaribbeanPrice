name: Availability build and publish
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/availability-watches]
permissions:
  contents: read
concurrency:
  group: availability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest unittests/ -q
      - name: Build container
        run: docker build -t royal-availability:ci .
      - name: Validate container entrypoint and configuration
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          config = yaml.safe_load(open('SAMPLE-availability-config.yaml'))
          config.pop('apprise', None)
          config['calendar'] = {'outputDirectory': '/app/data/calendar', 'sailings': [
              {'ship': 'IC', 'sailDate': '2099-10-10', 'departureTimeZone': 'America/New_York'}]}
          with open('config.availability.yaml', 'w') as f:
              yaml.safe_dump(config, f)
          PY
          docker compose -f compose.availability.yaml config --quiet
          docker run --rm -v "$PWD/config.availability.yaml:/app/config.yaml:ro" royal-availability:ci check --validate-config
  publish:
    needs: test
    # PRs and development branches never change the published image.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${REPOSITORY_OWNER,,}/royalcaribbean-availability" >> "$GITHUB_OUTPUT"
      - name: Publish availability image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:latest
            ${{ steps.registry.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Royal Caribbean entertainment and dining availability checker
      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.registry.outputs.image }}
        run: |
          echo "Image: $IMAGE_NAME:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
