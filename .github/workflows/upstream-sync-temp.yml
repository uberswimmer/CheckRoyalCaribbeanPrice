name: Temporary upstream merge probe

on:
  push:
    branches:
      - automation/upstream-2026-09-20

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect upstream conflicts
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jdeath/CheckRoyalCaribbeanPrice.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          set -e
          for f in CheckRoyalCaribbeanPrice.py docs/watchlist-addons.md docs/watchlist-cruise-url.md unittests/test_cabin_availability.py unittests/test_price_alert_exclusions.py; do
            echo "===== DIFF $f ====="
            git diff --cc -- "$f" || true
          done
          git merge --abort
