name: Temporary upstream reconciliation

on:
  push:
    branches:
      - automation/upstream-2026-09-16

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ contains(github.event.head_commit.message, '[upstream-sync-complete]') == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge upstream and reconcile fork changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jdeath/CheckRoyalCaribbeanPrice.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          merge_rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected=$'CheckRoyalCaribbeanPrice.py\nunittests/test_price_checker.py'
          if [ "$merge_rc" -ne 0 ] && [ "$conflicts" != "$expected" ]; then
            echo "Unexpected merge conflict set:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          if [ -n "$conflicts" ]; then
            git checkout --ours -- CheckRoyalCaribbeanPrice.py unittests/test_price_checker.py
          fi
          python tools/upstream_sync_temp.py
          git add CheckRoyalCaribbeanPrice.py unittests/test_price_checker.py UPSTREAM-BASELINE.md AVAILABILITY-REVIEW.md
      - name: Full repository validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest
          python -m pytest unittests/ -q
          python -m py_compile CheckRoyalCaribbeanPrice.py BrowseRoyalCaribbeanPrice.py
          bash -n entrypoint.sh
          python -c "import yaml; [yaml.safe_load(open(p)) for p in ['SAMPLE-availability-config.yaml','compose.availability.yaml','compose.local-web.yaml','.github/workflows/availability.yml']]"
          git diff --check
          docker build -t royal-availability:sync .
          python -c "import yaml; c=yaml.safe_load(open('SAMPLE-availability-config.yaml')); c.pop('apprise',None); c['reportDirectory']='/app/data/public'; c['calendar']={'outputDirectory':'/app/data/calendar','reservations':['1000001']}; yaml.safe_dump(c,open('config.sync.yaml','w'))"
          docker compose -f compose.availability.yaml config --quiet
          docker run --rm -v "$PWD/config.sync.yaml:/app/config.yaml:ro" royal-availability:sync check --validate-config
          docker build -f Dockerfile.web -t royal-reports:sync .
          mkdir -p "$PWD/web-sync"
          chmod 755 "$PWD/web-sync"
          docker run -d --name report-sync --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 -p 127.0.0.1:8088:8080 -v "$PWD/web-sync:/srv/exports:ro" royal-reports:sync
          trap 'docker logs report-sync; docker rm -f report-sync' EXIT
          python unittests/web_server_smoke.py http://127.0.0.1:8088 "$PWD/web-sync"
      - name: Commit reconciled upstream merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge upstream through eaaf68f [upstream-sync-complete]"
          git push origin HEAD:automation/upstream-2026-09-16
