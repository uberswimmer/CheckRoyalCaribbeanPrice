# Copy to config.availability.yaml. This file is not a live configuration.
# Use the credentials and Apprise URL from your existing checker.
accountInfo:
  - username: "YOUR_ROYAL_EMAIL"
    password: "YOUR_ROYAL_PASSWORD"
    cruiseLine: royalcaribbean
# Add overflow=split to this URL to let Apprise split oversized alerts.
# See AVAILABILITY-SETUP.md for ? versus & and per-account notification URLs.
apprise:
  - url: "YOUR_APPRISE_URL"

availability:
  # This instance performs only availability checks, using the same login code.
  only: true
  # Start by comparing log output with Cruise Planner, then change to false.
  dryRun: true
  stateFile: /app/data/availability.sqlite3
  watches:
    - id: entertainment
      name: "Entertainment reservations"
      reservation: "YOUR_ENTERTAINMENT_BOOKING_ID"
      category: show
      # Omit product to discover every show, including newly released shows.
      mode: release
      notifyOnReopen: false

    - id: specialty-dining
      name: "Specialty dining reservations"
      reservation: "YOUR_DINING_BOOKING_ID"
      category: dining
      product: YOUR_DINING_PRODUCT_CODE
      mode: release
      notifyOnReopen: false

    # Optional: escape rooms and other pt_onboardActivities products listed in
    # the entertainment catalog. Existing show watches do not include them.
    # - id: onboard-activities
    #   name: "Onboard activity reservations"
    #   reservation: "YOUR_ACTIVITY_BOOKING_ID"
    #   category: onboardActivities
    #   mode: release
    #   product: "YOUR_ACTIVITY_PRODUCT_CODE"  # Omit to discover matching activities.

    # Optional: enable a watch that also considers the configured party.
    # With guests omitted, the party is passengersInStateroom for this booking.
    # Existing reservations and limits can prevent party-mode alerts.
    # - id: show-party
    #   name: "Headliner for our party"
    #   reservation: "YOUR_ENTERTAINMENT_BOOKING_ID"
    #   category: show
    #   product: YOUR_SHOW_PRODUCT_CODE
    #   mode: party
    #   guests:
    #     - id: "GUEST_ID_1"
    #       reservationId: "YOUR_ENTERTAINMENT_BOOKING_ID"
    #     - id: "GUEST_ID_2"
    #       reservationId: "LINKED_BOOKING_ID"
