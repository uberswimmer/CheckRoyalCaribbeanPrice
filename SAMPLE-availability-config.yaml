# Copy to config.availability.yaml. This file is not a live configuration.
# Use the credentials and Apprise URL from your existing checker.
accountInfo:
  - username: "YOUR_ROYAL_EMAIL"
    password: "YOUR_ROYAL_PASSWORD"
    cruiseLine: royalcaribbean

# Add overflow=split to this URL to let Apprise split oversized alerts.
apprise:
  - url: "YOUR_APPRISE_URL"

availability:
  # Fork-only execution switch for the dedicated availability container.
  # Set false or omit when using availability alongside normal price checks.
  only: true

  # Start by comparing log output with Cruise Planner, then change to false.
  dryRun: true

  # The reservation-centric build uses a new state schema. Do not reuse the
  # older reservation-availability.json file from the watch-centric build.
  stateFile: /app/data/reservation-availability-v2.json

  reservations:
    - reservation: "YOUR_BOOKING_ID"
      # true = automatically discover every matching pt_dining product.
      dining: true
      # true = automatically discover every matching pt_show product.
      shows: true
      notifyOnReopen: false

    # Advanced example: monitor only selected dining products.
    # - reservation: "ANOTHER_BOOKING_ID"
    #   dining:
    #     products:
    #       - "UT_RAILDINNER"
    #   shows: false
    #   notifyOnReopen: false
