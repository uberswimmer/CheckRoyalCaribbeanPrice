# Copy to config.availability.yaml. This file is not a live configuration.
# Use the credentials and Apprise URL from your existing checker.
accountInfo:
  - username: "YOUR_ROYAL_EMAIL"
    password: "YOUR_ROYAL_PASSWORD"
    cruiseLine: royalcaribbean
apprise:
  - url: "YOUR_APPRISE_URL"

availability:
  # This instance performs only availability checks, using the same login code.
  only: true
  # Start by comparing log output with Cruise Planner, then change to false.
  dryRun: true
  stateFile: /app/data/availability.sqlite3
  watches:
    - id: icon-entertainment
      name: "Icon entertainment"
      reservation: "YOUR_ICON_BOOKING_ID"
      category: show
      # Omit product to discover every show, including newly released shows.
      mode: release
      notifyOnReopen: false

    - id: utopia-royal-railway
      name: "Utopia Royal Railway"
      reservation: "YOUR_UTOPIA_BOOKING_ID"
      category: dining
      product: UT_RAILDINNER
      mode: release
      notifyOnReopen: false

    # Optional: enable a watch that also considers the configured party.
    # With guests omitted, the party is passengersInStateroom for this booking.
    # Existing reservations and limits can prevent party-mode alerts.
    # - id: icon-headliner-party
    #   name: "Headliner for our party"
    #   reservation: "YOUR_ICON_BOOKING_ID"
    #   category: show
    #   product: Y7QG
    #   mode: party
    #   guests:
    #     - id: "GUEST_ID_1"
    #       reservationId: "YOUR_ICON_BOOKING_ID"
