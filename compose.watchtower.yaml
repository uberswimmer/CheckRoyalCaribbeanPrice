# Use after the first successful GitHub Actions publication.
# This service uses your existing Watchtower instance.
services:
  royal-availability:
    image: ghcr.io/uberswimmer/royalcaribbean-availability:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ:-America/New_York}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 7,19 * * *}
    volumes:
      - type: bind
        source: ./config.availability.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
