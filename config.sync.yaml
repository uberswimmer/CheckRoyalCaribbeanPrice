accountInfo:
- cruiseLine: royalcaribbean
  password: YOUR_ROYAL_PASSWORD
  username: YOUR_ROYAL_EMAIL
availability:
  dryRun: true
  only: true
  stateFile: /app/data/availability.sqlite3
  watches:
  - category: show
    id: entertainment
    mode: release
    name: Entertainment reservations
    notifyOnReopen: false
    reservation: YOUR_ENTERTAINMENT_BOOKING_ID
  - category: dining
    id: specialty-dining
    mode: release
    name: Specialty dining reservations
    notifyOnReopen: false
    product: YOUR_DINING_PRODUCT_CODE
    reservation: YOUR_DINING_BOOKING_ID
calendar:
  outputDirectory: /app/data/calendar
  reservations:
  - '1000001'
reportDirectory: /app/data/public
