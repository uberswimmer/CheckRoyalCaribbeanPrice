worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    default_type application/octet-stream;
    charset utf-8;
    # Resolve at request time so reports still work while the checker is restarting
    # or when this image is used without the optional controller.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /srv/exports;
        autoindex off;
        etag off;
        if_modified_since off;
        disable_symlinks on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        # GET also allows HEAD. Report and calendar exports remain read-only.
        location = / {
            limit_except GET { deny all; }
            default_type text/html;
            # Also works with reports saved before the control feature existed.
            sub_filter '</head>' '<script src="/run-control.js" defer></script></head>';
            sub_filter_once on;
            try_files /index.html @empty_report;
        }
        location @empty_report {
            root /usr/share/nginx/html;
            default_type text/html;
            try_files /empty-report.html =503;
        }
        location = /run-control.js {
            limit_except GET { deny all; }
            root /usr/share/nginx/html;
            default_type application/javascript;
            try_files /run-control.js =404;
        }
        location = /api/check {
            limit_except GET POST { deny all; }
            client_max_body_size 1k;
            set $checker_control cruise-availability-checker:8081;
            proxy_pass http://$checker_control;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location = /report.txt {
            limit_except GET { deny all; }
            default_type text/plain;
            try_files /report.txt =404;
        }
        location = /cruises.ics {
            limit_except GET { deny all; }
            default_type text/calendar;
            try_files /cruises.ics =404;
        }
        location / { return 404; }
    }
}
