worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    default_type application/octet-stream;
    charset utf-8;
    server {
        listen 8080;
        root /srv/exports;
        autoindex off;
        etag off;
        if_modified_since off;
        disable_symlinks on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        # GET also allows HEAD. No write or script execution routes exist.
        location = / {
            limit_except GET { deny all; }
            default_type text/html;
            try_files /index.html =503;
        }
        location = /report.txt {
            limit_except GET { deny all; }
            default_type text/plain;
            try_files /report.txt =404;
        }
        location = /cruises.ics {
            limit_except GET { deny all; }
            default_type text/calendar;
            try_files /cruises.ics =404;
        }
        location / { return 404; }
    }
}
